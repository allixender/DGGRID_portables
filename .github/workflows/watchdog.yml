# Watchdog: when sahrk/DGGRID master moves past the pinned submodule commit, open a PR
# that bumps the submodule and run the build/test workflow on it.
#
# PRs and pushes made with GITHUB_TOKEN do not trigger other workflows, so build.yml is
# started explicitly via workflow_dispatch on the bump branch (its checks show on the PR).
# Needs repo setting: Actions -> "Allow GitHub Actions to create and approve pull requests".
name: watchdog

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: https://github.com/sahrk/DGGRID.git
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned and upstream commit
        id: cmp
        run: |
          pinned=$(git ls-tree HEAD DGGRID | awk '{print $3}')
          upstream=$(git ls-remote "$UPSTREAM" refs/heads/master | cut -f1)
          echo "pinned=$pinned upstream=$upstream"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "branch=watchdog/dggrid-${upstream:0:10}" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$upstream" ]; then
            echo "up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin "refs/heads/watchdog/dggrid-${upstream:0:10}" >/dev/null; then
            echo "bump branch for ${upstream:0:10} already exists" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodule and open PR
        if: steps.cmp.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.cmp.outputs.pinned }}
          UPSTREAM_SHA: ${{ steps.cmp.outputs.upstream }}
          BRANCH: ${{ steps.cmp.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git submodule update --init DGGRID
          git -C DGGRID fetch origin master
          git -C DGGRID checkout --quiet "$UPSTREAM_SHA"
          ver=$(sed -n 's/^#define DGGRID_VERSION *"\(.*\)"/\1/p' DGGRID/src/lib/dglib/include/dglib/DgBase.h)

          git switch -c "$BRANCH"
          git add DGGRID
          git commit -m "bump DGGRID to sahrk/DGGRID@${UPSTREAM_SHA:0:10} (${ver})"
          git push origin "$BRANCH"

          {
            echo "sahrk/DGGRID master moved: \`${PINNED:0:10}\` -> \`${UPSTREAM_SHA:0:10}\` (DGGRID_VERSION ${ver})"
            echo
            echo "Compare: https://github.com/sahrk/DGGRID/compare/${PINNED}...${UPSTREAM_SHA}"
            echo
            echo "Upstream commits:"
            git -C DGGRID log --format='- %h %s (%an)' "${PINNED}..${UPSTREAM_SHA}" | head -50
            echo
            echo "Build/test runs via workflow_dispatch on this branch, see the checks below."
          } > body.md
          gh pr create --base main --head "$BRANCH" \
            --title "bump DGGRID to ${UPSTREAM_SHA:0:10} (${ver})" --body-file body.md

          gh workflow run build.yml --ref "$BRANCH"
