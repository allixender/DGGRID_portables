# Entry point: pick the upstream lines (rows of upstream.json) this event builds and run
# the build/test/publish pipeline (line.yml) once per line. ci/plan_lines.sh decides:
#   pull request       -> default line full, other lines build-only
#   push to main       -> rolling lines full + rolling pre-release (edge, edge-v91b, ...),
#                         fixed lines build-only
#   tag vX[-rN]        -> the fixed line with release vX, full + release <tag>
#   workflow_dispatch  -> full, no publish; input `line` limits it to one line (watchdog)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'prototype/**']
  pull_request:
    paths-ignore: ['**.md', 'prototype/**']
  workflow_dispatch:
    inputs:
      line:
        description: 'only this line from upstream.json (empty: all lines)'
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ inputs.line }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      lines: ${{ steps.plan.outputs.lines }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          ONLY: ${{ inputs.line }}
        run: ci/plan_lines.sh >> "$GITHUB_OUTPUT"

  line:
    needs: plan
    name: ${{ matrix.l.line }}
    strategy:
      fail-fast: false
      matrix:
        l: ${{ fromJSON(needs.plan.outputs.lines) }}
    permissions:
      contents: write   # for the publish job in line.yml
    uses: ./.github/workflows/line.yml
    with:
      line: ${{ matrix.l.line }}
      sha: ${{ matrix.l.sha }}
      patches: ${{ matrix.l.patches }}
      release: ${{ matrix.l.release }}
      prerelease: ${{ matrix.l.prerelease }}
      tests: ${{ matrix.l.tests }}
      publish: ${{ matrix.l.publish }}
