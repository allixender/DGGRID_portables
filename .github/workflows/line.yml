# Pipeline for one upstream line (a row of upstream.json), called once per line by
# build.yml: build all portable DGGRID binaries on one Linux runner (zig cross-compile),
# test them on native runners, and publish:
#   publish=rolling -> rolling pre-release <release> (stable asset URLs, replaced each time)
#   publish=fixed   -> release for the pushed tag <release>, never replaced
# tests=build-only stops after the build job (patches apply, all targets cross-compile).
name: line

on:
  workflow_call:
    inputs:
      line:       { type: string, required: true }
      sha:        { type: string, default: '' }      # '' = the submodule gitlink
      patches:    { type: string, default: '' }
      release:    { type: string, required: true }
      prerelease: { type: string, default: 'true' }
      tests:      { type: string, default: full }    # full | build-only
      publish:    { type: string, default: none }    # none | rolling | fixed

env:
  ZIG_VERSION: 0.16.0
  LINE: ${{ inputs.line }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      dggrid_version: ${{ steps.meta.outputs.dggrid_version }}
      dggrid_commit: ${{ steps.meta.outputs.dggrid_commit }}
      patches: ${{ steps.meta.outputs.patches }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check out the line's DGGRID commit, apply its patches
        run: ci/use_line.sh "$LINE"

      - name: Build release targets
        run: zig build release --summary new

      - name: Collect metadata
        id: meta
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          ver=$(sed -n 's/^#define DGGRID_VERSION *"\(.*\)"/\1/p' DGGRID/src/lib/dglib/include/dglib/DgBase.h)
          echo "dggrid_version=$ver" >> "$GITHUB_OUTPUT"
          echo "dggrid_commit=$(git -C DGGRID rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # publish has no checkout, so hand it the applied patch list
          echo "patches=$(cd "${PATCHES:-/nonexistent}" 2>/dev/null && ls -- *.patch 2>/dev/null | paste -sd' ' -)" >> "$GITHUB_OUTPUT"

      - name: Universal macOS binary
        run: |
          lipo=$(command -v llvm-lipo || ls /usr/bin/llvm-lipo-* /usr/lib/llvm-*/bin/llvm-lipo 2>/dev/null | sort -V | tail -1)
          if [ -z "$lipo" ]; then echo "::warning::llvm-lipo not found, skipping macos-universal"; exit 0; fi
          mkdir -p zig-out/release/macos-universal
          "$lipo" -create zig-out/release/macos-x86_64/dggrid zig-out/release/macos-arm64/dggrid \
            -output zig-out/release/macos-universal/dggrid
          "$lipo" -info zig-out/release/macos-universal/dggrid

      - name: Package
        env:
          DGGRID_VERSION: ${{ steps.meta.outputs.dggrid_version }}
          DGGRID_COMMIT: ${{ steps.meta.outputs.dggrid_commit }}
          PATCH_LIST: ${{ steps.meta.outputs.patches }}
          PATCHES: ${{ inputs.patches }}
        run: |
          mkdir -p dist
          for dir in zig-out/release/*/; do
            platform=$(basename "$dir")
            name="dggrid-${DGGRID_VERSION}-${platform}"
            stage="stage/$name"
            mkdir -p "$stage"
            cp "$dir"/dggrid* "$stage"/
            cp LICENSE "$stage"/
            {
              echo "DGGRID ${DGGRID_VERSION}, GDAL-free portable build"
              echo "platform:        ${platform}"
              echo "upstream commit: https://github.com/sahrk/DGGRID/commit/${DGGRID_COMMIT}"
              echo "upstream line:   ${LINE}"
              echo "built from:      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
              echo "zig:             ${ZIG_VERSION}"
              for pf in $PATCH_LIST; do echo "patch:           ${PATCHES}/${pf}"; done
              echo "license:         AGPL-3.0 (see LICENSE)"
            } > "$stage/BUILDINFO.txt"
            # asset names without version -> stable URLs, e.g. releases/download/edge/dggrid-linux-x86_64.tar.gz
            case "$platform" in
              windows-*) (cd stage && zip -qr "../dist/dggrid-${platform}.zip" "$name") ;;
              *)         tar -C stage -czf "dist/dggrid-${platform}.tar.gz" "$name" ;;
            esac
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.line }}
          path: dist/
          if-no-files-found: error

  ubsan:
    # UB sanitizer in trap mode: any UB on the examples' code paths aborts the run
    if: inputs.tests == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: ci/use_line.sh "$LINE"
      - run: zig build -Doptimize=ReleaseSafe -Dubsan=true
      - run: ci/run_examples.sh zig-out/bin/dggrid "$RUNNER_TEMP/examples"

  test:
    needs: build
    if: inputs.tests == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15,         platform: macos-arm64 }
          - { runner: macos-15,         platform: macos-universal }
          - { runner: macos-15-intel,   platform: macos-x86_64 }
          - { runner: macos-15-intel,   platform: macos-universal }
          - { runner: windows-2025,     platform: windows-x86_64 }
          - { runner: windows-11-arm,   platform: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.platform }} on ${{ matrix.runner }})
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings in example inputs
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - name: Checkout DGGRID submodule at the line's commit (examples)
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git submodule update --init --depth 1 DGGRID
          if [ -n "$SHA" ]; then
            git -C DGGRID fetch --depth 1 origin "$SHA"
            git -C DGGRID checkout --detach "$SHA"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.line }}
          path: dist

      - name: Unpack release archive
        run: |
          mkdir -p unpacked
          if [ -f "dist/dggrid-${{ matrix.platform }}.zip" ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path dist/dggrid-${{ matrix.platform }}.zip -DestinationPath unpacked"
          else
            tar -C unpacked -xzf "dist/dggrid-${{ matrix.platform }}.tar.gz"
          fi
          exe=""
          for f in unpacked/*/dggrid.exe unpacked/*/dggrid; do
            if [ -f "$f" ]; then exe=$f; break; fi
          done
          [ -n "$exe" ] || { echo "::error::no dggrid binary in archive"; exit 1; }
          echo "EXE=$exe" >> "$GITHUB_ENV"
          cat unpacked/*/BUILDINFO.txt
          "$exe" -v > version.txt 2>&1 || true
          head -2 version.txt

      - name: Run examples
        run: ci/run_examples.sh "$EXE" "$RUNNER_TEMP/examples"

      - name: Compare outputs with upstream sampleOutput (informational)
        if: always()
        continue-on-error: true
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py ci/compare_outputs.py "$RUNNER_TEMP/examples"

      - name: Upload example outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ inputs.line }}-${{ matrix.platform }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/examples/*/outputfiles/
          retention-days: 14

  publish:
    needs: [build, test, ubsan]
    if: inputs.publish != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ inputs.release }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DGGRID_VERSION: ${{ needs.build.outputs.dggrid_version }}
      DGGRID_COMMIT: ${{ needs.build.outputs.dggrid_commit }}
      PATCH_LIST: ${{ needs.build.outputs.patches }}
      PATCHES: ${{ inputs.patches }}
      RELEASE: ${{ inputs.release }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ inputs.line }}
          path: dist

      - name: Release notes
        run: |
          {
            echo "GDAL-free portable DGGRID ${DGGRID_VERSION} binaries, cross-compiled with Zig ${ZIG_VERSION}."
            echo
            echo "- upstream: sahrk/DGGRID@${DGGRID_COMMIT:0:10} (line \`${LINE}\`)"
            echo "- built from: ${GITHUB_SHA:0:10}"
            if [ -n "$PATCH_LIST" ]; then
              echo "- patches on top of upstream: $(for pf in $PATCH_LIST; do printf '`%s` ' "$pf"; done)([${PATCHES}/](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/${PATCHES}))"
            else
              echo "- patches on top of upstream: none"
            fi
            echo
            echo "| platform | asset |"
            echo "|---|---|"
            for f in dist/dggrid-*; do echo "| ${f#dist/dggrid-} | \`$(basename "$f")\` |"; done
            echo
            echo "Checksums in \`SHA256SUMS\`. macOS: downloaded binaries are not notarised, run \`xattr -d com.apple.quarantine dggrid\` once."
            echo
            echo "**Known issues (Windows):**"
            echo "- arm64: coordinates can differ by up to ~1e-5 degrees from other platforms; clipped grids may include slightly different boundary cells (under investigation)."
            echo
            echo "Details: [build_notes.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/build_notes.md)"
          } > notes.md

      - name: Update rolling pre-release
        if: inputs.publish == 'rolling'
        run: |
          pre=""; [ "$PRERELEASE" = true ] && pre="--prerelease"
          gh release delete "$RELEASE" --cleanup-tag --yes || true
          gh release create "$RELEASE" dist/* $pre --target "$GITHUB_SHA" \
            --title "${RELEASE}: DGGRID ${DGGRID_VERSION} @ ${DGGRID_COMMIT:0:7}" --notes-file notes.md

      - name: Tagged release
        if: inputs.publish == 'fixed'
        run: |
          pre=""; [ "$PRERELEASE" = true ] && pre="--prerelease"
          gh release create "$RELEASE" dist/* --verify-tag $pre \
            --title "DGGRID ${DGGRID_VERSION} portable (${RELEASE})" --notes-file notes.md
